<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Radar</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <main class="popup">
      <header class="topbar">
        <div>
          <p class="eyebrow">Radar V1</p>
          <h1>Live Assist</h1>
        </div>
        <span id="statusPill" class="pill">Idle</span>
      </header>

      <section class="field">
        <label for="apiBase">Radar API</label>
        <input id="apiBase" type="url" value="http://localhost:3000" />
      </section>

      <section class="capture">
        <label class="check">
          <input id="activeTab" type="checkbox" checked />
          <span>Active tab context</span>
        </label>
        <label class="check">
          <input id="microphone" type="checkbox" />
          <span>Microphone transcription</span>
        </label>
      </section>

      <section class="notice" id="notice">
        Start Radar only after the call participant consent and workspace policy checks are complete.
      </section>

      <section class="actions">
        <button id="preflight" class="secondary" type="button">Preflight</button>
        <button id="start" class="primary" type="button">Start</button>
        <button id="pause" class="secondary" type="button">Pause</button>
        <button id="resume" class="secondary" type="button">Resume</button>
        <button id="end" class="danger" type="button">End</button>
      </section>

      <section class="status">
        <dl>
          <div>
            <dt>Session</dt>
            <dd id="sessionId">None</dd>
          </div>
          <div>
            <dt>Realtime</dt>
            <dd id="realtimeState">Unknown</dd>
          </div>
          <div>
            <dt>Transcript</dt>
            <dd id="transcriptionState">Idle</dd>
          </div>
          <div>
            <dt>Guidance</dt>
            <dd id="cardState">No card</dd>
          </div>
        </dl>
      </section>
    </main>
    <script src="./popup.js"></script>
  </body>
</html>
